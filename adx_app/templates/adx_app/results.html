{% extends "adx_app/base.html" %}

{% block content %}
<div class="row">
    <div class="col-12 mb-3">
        <a href="{% url 'index' %}" class="btn btn-outline-secondary">&larr; Upload New File</a>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card shadow mb-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Analysis Result</h4>
                <a href="{% url 'download' %}" class="btn btn-light btn-sm fw-bold">Download Output CSV</a>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    {% if chart %}
                    <img src="data:image/png;base64,{{ chart }}" alt="ADX Chart" class="chart-img">
                    {% else %}
                    <p class="text-danger">Failed to generate chart.</p>
                    {% endif %}
                </div>
            </div>
            <div class="card-footer text-muted">
                The output CSV contains all intermediate calculations matching standard Wilder's ADX formulas.
            </div>
        </div>
    </div>
</div>
{% endblock %}
