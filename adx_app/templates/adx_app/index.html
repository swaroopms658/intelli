{% extends "adx_app/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Upload Stock Data</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">
                    Upload a CSV file containing <strong>Open, High, Low, Close</strong> columns.
                </p>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% if form.errors %}
                    <div class="alert alert-danger">
                        {{ form.errors }}
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.file.id_for_label }}" class="form-label">Select CSV File</label>
                        <input type="file" name="file" class="form-control" id="{{ form.file.id_for_label }}"
                            accept=".csv" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Calculate ADX</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
